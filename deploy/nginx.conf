server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /downloads/DevPlay.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="DevPlay.apk"';
    }

    location = /downloads/DevPlay-linux-x64.tar.gz {
        default_type application/gzip;
        add_header Content-Disposition 'attachment; filename="DevPlay-linux-x64.tar.gz"';
    }

    location = /downloads/DevPlay-amd64.deb {
        default_type application/vnd.debian.binary-package;
        add_header Content-Disposition 'attachment; filename="DevPlay-amd64.deb"';
    }

    location /downloads/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
